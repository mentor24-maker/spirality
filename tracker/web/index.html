<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tracker</title>
  <link rel="icon" type="image/png" href="/web/icon.png">
  <link rel="stylesheet" href="/web/app.css">
  <script type="module" src="/web/app.mjs"></script>
</head>
<body>
  <header>
    <a class="brand" href="/"><img src="/web/wordmark.png" alt="Spirality" width="160" height="40"></a>
    <nav class="site">
      <a href="/projects" data-nav="projects">Projects</a>
      <a href="/tasks" data-nav="tasks">Tasks</a>
      <a href="/new" data-nav="new">New request</a>
      <a href="/settings" data-nav="settings">Settings</a>
    </nav>
    <span class="me">
      <span id="project" hidden></span>
      <a id="bell" href="/" title="Waiting on you" aria-label="Waiting on you" data-colour="grey" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></a>
      <span id="who"></span>
      <button id="sign-out" type="button" hidden>Sign out</button>
    </span>
  </header>
  <main id="main"><p class="quiet">Loading…</p></main>
</body>
</html>
